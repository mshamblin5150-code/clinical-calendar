name: Android private release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-private-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 17.0.20+8

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Require release signing configuration
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: ./tool/android/assert_release_environment.ps1

      - name: Resolve workspace and run quality gate
        run: |
          flutter pub get
          dart run tool/quality.dart

      - name: Materialize ephemeral keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP 'clinical-calendar-release.keystore'
          [IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )
          "CLINICAL_CALENDAR_ANDROID_KEYSTORE_PATH=$keystorePath" >> $env:GITHUB_ENV

      - name: Capture protected-signer release-size ledger
        shell: pwsh
        env:
          CLINICAL_CALENDAR_ENVIRONMENT: private-release
          CLINICAL_CALENDAR_SUPABASE_URL: ${{ vars.CLINICAL_CALENDAR_SUPABASE_URL }}
          CLINICAL_CALENDAR_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CLINICAL_CALENDAR_SUPABASE_PUBLISHABLE_KEY }}
          CLINICAL_CALENDAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLINICAL_CALENDAR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLINICAL_CALENDAR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          ./tool/android/capture_release_size_ledger.ps1 `
            -FlutterExecutable (Get-Command flutter).Source `
            -ExpectedSignerSha256 $env:ANDROID_SIGNING_CERT_SHA256 `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'release-size-ledger.json')

      - name: Rebuild and verify signer-matched release and profile APKs
        shell: pwsh
        env:
          CLINICAL_CALENDAR_ENVIRONMENT: private-release
          CLINICAL_CALENDAR_SUPABASE_URL: ${{ vars.CLINICAL_CALENDAR_SUPABASE_URL }}
          CLINICAL_CALENDAR_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CLINICAL_CALENDAR_SUPABASE_PUBLISHABLE_KEY }}
          CLINICAL_CALENDAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLINICAL_CALENDAR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLINICAL_CALENDAR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          ./tool/android/package_signed_apk.ps1 `
            -FlutterExecutable (Get-Command flutter).Source `
            -ExpectedSignerSha256 $env:ANDROID_SIGNING_CERT_SHA256
          ./tool/android/package_signed_profile_apk.ps1 `
            -FlutterExecutable (Get-Command flutter).Source `
            -ExpectedSignerSha256 $env:ANDROID_SIGNING_CERT_SHA256

      - name: Upload signed private release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clinical-calendar-android-${{ github.sha }}
          path: |
            apps/clinical_calendar/build/app/outputs/flutter-apk/app-release.apk
            apps/clinical_calendar/build/app/outputs/flutter-apk/app-release.apk.sha256
            apps/clinical_calendar/build/app/outputs/flutter-apk/app-profile.apk
            apps/clinical_calendar/build/app/outputs/flutter-apk/app-profile.apk.sha256
            ${{ runner.temp }}/release-size-ledger.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral keystore
        if: always()
        shell: pwsh
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP 'clinical-calendar-release.keystore'
          if (Test-Path -LiteralPath $keystorePath) {
            Remove-Item -LiteralPath $keystorePath -Force
          }
