name: Capture Linux Variant F goldens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Generate Linux goldens
        working-directory: packages/clinical_calendar_presentation
        run: >-
          flutter test test/clinical_calendar_app_test.dart
          --plain-name 'accepted pre-catalog Variant F renders'
          --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: issue-125-linux-goldens
          path: packages/clinical_calendar_presentation/test/baselines/variant_f_renders/linux
          if-no-files-found: error
