name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Verify Windows release contract
        shell: pwsh
        run: |
          ./tool/windows/windows_release_contract_test.ps1
          ./tool/windows/verify_release_bundle_test.ps1
      - name: Verify web release contract
        shell: pwsh
        run: |
          ./tool/web/pages_workflow_contract_test.ps1
          ./tool/web/build_pages_contract_test.ps1
      - name: Resolve workspace
        run: flutter pub get
      - name: Run shared quality gate
        run: dart run tool/quality.dart
      - name: Run Chrome export acceptance
        working-directory: packages/clinical_calendar_platform
        run: flutter test --platform chrome test/web_export_file_saver_browser_test.dart
      - name: Build web release
        working-directory: apps/clinical_calendar
        run: flutter build web --release --base-href /clinical-calendar/
