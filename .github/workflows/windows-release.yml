name: Windows private release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-sign-verify:
    strategy:
      matrix:
        include:
          - runner: windows-2025
            flutter: 3.44.8
            windows_sdk: 10.0.26100.0
            timestamp_url: http://timestamp.digicert.com
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: windows-private-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify protected release contract
        shell: pwsh
        run: |
          ./tool/windows/windows_release_contract_test.ps1
          ./tool/windows/verify_release_bundle_test.ps1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: Require release signing secrets
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PUBLISHER) -or
              $env:WINDOWS_SIGNING_CERT_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') {
            throw 'Windows release signing secrets, Publisher, and approved signer SHA-256 are required.'
          }

      - name: Resolve workspace and run quality gate
        run: |
          flutter pub get
          dart run tool/quality.dart

      - name: Import ephemeral signing certificate
        id: certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'clinical-calendar-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $importedCertificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false)
            $signingCertificates = @($importedCertificates | Where-Object HasPrivateKey)
            if ($signingCertificates.Count -ne 1) {
              throw 'The PFX must contain exactly one signing certificate with a private key.'
            }
            $certificate = $signingCertificates[0]
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          } finally {
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
          }

      - name: Build, package, sign, and verify MSIX
        shell: pwsh
        env:
          CLINICAL_CALENDAR_ENVIRONMENT: private-release
          CLINICAL_CALENDAR_SUPABASE_URL: ${{ vars.CLINICAL_CALENDAR_SUPABASE_URL }}
          CLINICAL_CALENDAR_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CLINICAL_CALENDAR_SUPABASE_PUBLISHABLE_KEY }}
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
        run: |
          ./tool/windows/package_msix.ps1 `
            -SigningThumbprint '${{ steps.certificate.outputs.thumbprint }}' `
            -ExpectedSignerSha256 $env:WINDOWS_SIGNING_CERT_SHA256 `
            -Publisher $env:WINDOWS_SIGNING_PUBLISHER `
            -TimestampUrl '${{ matrix.timestamp_url }}' `
            -WindowsSdkVersion '${{ matrix.windows_sdk }}' `
            -FlutterExecutable (Get-Command flutter).Source

      - name: Write and independently verify release provenance
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
        run: |
          $releaseRoot = Resolve-Path 'apps/clinical_calendar/build/windows/msix'
          $package = @(Get-ChildItem -LiteralPath $releaseRoot -Filter '*.msix' -File)
          $checksum = @(Get-ChildItem -LiteralPath $releaseRoot -Filter '*.msix.sha256' -File)
          $evidence = @(Get-ChildItem -LiteralPath $releaseRoot -Filter '*.msix.signature.txt' -File)
          if ($package.Count -ne 1 -or $checksum.Count -ne 1 -or $evidence.Count -ne 1) {
            throw 'Packaging must produce exactly one MSIX, checksum, and signature evidence file.'
          }
          if ($package[0].BaseName -notmatch '^ClinicalCalendar-(\d+\.\d+\.\d+\.\d+)-x64$') {
            throw 'Signed MSIX file name does not contain the required version and architecture.'
          }
          $provenancePath = Join-Path $releaseRoot 'windows_release_provenance.json'
          ./tool/windows/write_release_provenance.ps1 `
            -PackagePath $package[0].FullName `
            -ChecksumPath $checksum[0].FullName `
            -SignatureEvidencePath $evidence[0].FullName `
            -OutputPath $provenancePath `
            -Repository '${{ github.repository }}' `
            -CommitSha '${{ github.sha }}' `
            -WorkflowRef '${{ github.workflow_ref }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -Publisher $env:WINDOWS_SIGNING_PUBLISHER `
            -SignerSha256 $env:WINDOWS_SIGNING_CERT_SHA256 `
            -Version $Matches[1] `
            -RunnerImage '${{ matrix.runner }}' `
            -FlutterVersion '${{ matrix.flutter }}' `
            -WindowsSdkVersion '${{ matrix.windows_sdk }}'
          ./tool/windows/verify_release_bundle.ps1 `
            -BundlePath $releaseRoot `
            -ExpectedPublisher $env:WINDOWS_SIGNING_PUBLISHER `
            -ExpectedSignerSha256 $env:WINDOWS_SIGNING_CERT_SHA256 `
            -ExpectedRepository '${{ github.repository }}' `
            -ExpectedCommitSha '${{ github.sha }}' `
            -ExpectedRunnerImage '${{ matrix.runner }}' `
            -ExpectedFlutterVersion '${{ matrix.flutter }}' `
            -WindowsSdkVersion '${{ matrix.windows_sdk }}'

      - name: Attest immutable release candidate
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: apps/clinical_calendar/build/windows/msix/*.msix

      - name: Include offline provenance attestation
        shell: pwsh
        run: |
          Copy-Item -LiteralPath '${{ steps.attest.outputs.bundle-path }}' `
            -Destination 'apps/clinical_calendar/build/windows/msix/windows_release_provenance.sigstore.json'

      - name: Upload signed private release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clinical-calendar-windows-${{ github.sha }}
          path: |
            apps/clinical_calendar/build/windows/msix/*.msix
            apps/clinical_calendar/build/windows/msix/*.sha256
            apps/clinical_calendar/build/windows/msix/*.signature.txt
            apps/clinical_calendar/build/windows/msix/windows_release_provenance.json
            apps/clinical_calendar/build/windows/msix/windows_release_provenance.sigstore.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove ephemeral signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $certificatePath = "Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}"
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }
