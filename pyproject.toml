[dependency-groups]
python-quality = ["ruff>=0.17,<1", "mypy>=2.4,<3", "Pillow>=11,<13"]

[tool.ruff]
target-version = "py312"
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["tool/branding", ".claude/skills/ticket-sweep/evals"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
