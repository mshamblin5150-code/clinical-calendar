name: clinical_calendar_presentation
description: Shared responsive Variant F presentation boundary.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  clinical_calendar_application:
    path: ../clinical_calendar_application
  clinical_calendar_domain:
    path: ../clinical_calendar_domain
  flutter_svg: ^2.2.0

dev_dependencies:
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/botanical_study_raster/
    - assets/botanical_study_raster/dashboard-chassis-landscape-v2.png
    - assets/federation_2399_raster/panel-nine-slice-v1.png
    - assets/federation_2399_raster/dashboard-chassis-landscape-v1.png
    - assets/coastal_light_raster/
    - assets/federation_classic_raster/
    - assets/graphite_raster/
    - assets/heritage_field_notes_fonts/OFL.txt
    - assets/heritage_field_notes_brand/
    - assets/heritage_field_notes_materials/
    - assets/heritage_field_notes_raster/
    - assets/placement_icons/
    - assets/variant_f_raster/
  fonts:
    - family: FieldArchiveCondensed
      fonts:
        - asset: assets/heritage_field_notes_fonts/RobotoCondensed-Variable.ttf
